name: Python 3.10 tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-3-10-tests:
    name: Python 3.10 unittest suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      portal-postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: ntubtob_portal_local
          POSTGRES_USER: portal_local
          POSTGRES_PASSWORD: local-only-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U portal_local -d ntubtob_portal_local"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Show Python version
        run: python --version

      - name: Install route test dependencies
        run: python -m pip install flask==3.0.0 flask-caching==2.3.0 functions-framework==3.* line-bot-sdk==3.11.0

      - name: Install portal data test dependencies
        run: python -m pip install -r requirements-migrations.txt black==24.4.2

      - name: Check portal data formatting
        run: >-
          python -m black --check
          migrations/versions/0002_portal_data_foundation.py
          migrations/versions/0004_phase_c_identity_lifecycle.py
          shared_lib/shared_module/portal_data/identity_lifecycle.py
          tools/portal_data_migration_readiness.py
          tools/portal_data_phase_a_evidence.py
          tools/portal_data_phase_c_evidence.py
          tools/portal_data_phase_c_migration.py
          tools/setup_portal_data_legacy.py
          tests/portal_data/test_migration_readiness.py
          tests/portal_data/test_phase_a_evidence.py
          tests/portal_data/test_phase_c_lifecycle.py

      - name: Verify Phase C review artifacts
        run: |
          python -m tools.portal_data_phase_c_migration verify
          python -m tools.portal_data_phase_c_evidence

      - name: Run portal data PostgreSQL tests
        env:
          PORTAL_DATA_DATABASE_URL: postgresql+psycopg2://portal_local:local-only-password@127.0.0.1:55432/ntubtob_portal_local
          PORTAL_DATA_TEST_DATABASE_URL: postgresql+psycopg2://portal_local:local-only-password@127.0.0.1:55432/ntubtob_portal_local
        run: |
          python -m tools.setup_portal_data_legacy
          python -m alembic upgrade head
          python -m unittest discover -s tests/portal_data -v

      - name: Run Web Portal tests
        run: python -m unittest discover -s apps/web_portal/tests -v

      - name: Run game broadcast service tests
        run: python -m unittest discover -s apps/game_broadcast_service/tests -v

      - name: Run notify cronjob service tests
        run: python -m unittest discover -s apps/notify_cronjob_service/tests -v

      - name: Run scheduled service deployment wrapper tests
        run: python -m unittest discover -s tools/tests -v

      - name: Run update game schedule tests
        run: python -m unittest discover -s functions/update_game_schedule/tests -v

      - name: Run LINE webhook ingress tests
        run: python -m unittest discover -s functions/line_webhook_handler/tests -v

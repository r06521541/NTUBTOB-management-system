name: Python 3.10 tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-3-10-tests:
    name: Python 3.10 unittest suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Show Python version
        run: python --version

      - name: Run game broadcast service tests
        run: python -m unittest discover -s apps/game_broadcast_service/tests -v

      - name: Run notify cronjob service tests
        run: python -m unittest discover -s apps/notify_cronjob_service/tests -v

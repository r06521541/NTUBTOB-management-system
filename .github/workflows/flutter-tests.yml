name: Flutter tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Flutter 3.47.0 / Android API 36 gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/flutter_app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdk_roots=()
          add_sdk_root() {
            local candidate_root="$1"
            if [[ -z "$candidate_root" || "$candidate_root" != /* || ! -d "$candidate_root" ]]; then
              return
            fi
            local resolved_root
            resolved_root="$(realpath -e "$candidate_root")"
            local existing_root
            for existing_root in "${sdk_roots[@]}"; do
              if [[ "$existing_root" == "$resolved_root" ]]; then
                return
              fi
            done
            sdk_roots+=("$resolved_root")
          }
          for candidate_root in \
            "${ANDROID_SDK_ROOT:-}" \
            "${ANDROID_HOME:-}" \
            "/usr/local/lib/android/sdk"; do
            add_sdk_root "$candidate_root"
          done

          sdkmanager_path=""
          sdk_root=""
          for approved_root in "${sdk_roots[@]}"; do
            candidates=("$approved_root/cmdline-tools/latest/bin/sdkmanager")
            if [[ -d "$approved_root/cmdline-tools" ]]; then
              while IFS= read -r -d '' candidate; do
                candidates+=("$candidate")
              done < <(
                find "$approved_root/cmdline-tools" \
                  -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print0 \
                  | sort -z -V -r
              )
            fi
            candidates+=("$approved_root/tools/bin/sdkmanager")
            for candidate in "${candidates[@]}"; do
              if [[ ! -x "$candidate" ]]; then
                continue
              fi
              candidate_real="$(realpath -e "$candidate")"
              case "$candidate_real" in
                "$approved_root"/*) ;;
                *) continue ;;
              esac
              sdkmanager_path="$candidate_real"
              sdk_root="$approved_root"
              break 2
            done
          done
          if [[ -z "$sdkmanager_path" || -z "$sdk_root" ]]; then
            echo "Android sdkmanager was not found in approved SDK roots" >&2
            exit 1
          fi

          echo "Android SDK root: $sdk_root"
          echo "Android sdkmanager: $sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$sdk_root" --version
          "$sdkmanager_path" --sdk_root="$sdk_root" "platforms;android-36"
          if [[ \
            ! -f "$sdk_root/platforms/android-36/package.xml" && \
            ! -f "$sdk_root/platforms/android-36/source.properties" \
          ]]; then
            echo "Android API 36 installation was not materialized" >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build fake Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_FLAVOR=development
          --dart-define=CLIENT_MODE=fake

      - name: Prove unsigned release fails closed
        run: |
          if flutter build appbundle --release \
            --dart-define=RELEASE_CHANNEL=android-closed \
            --dart-define=APP_FLAVOR=staging \
            --dart-define=CLIENT_MODE=real \
            --dart-define=RELEASE_SCOPE=basic \
            --dart-define=API_BASE_URL=https://mobile-release.invalid \
            --dart-define=LINE_CHANNEL_ID=12345 \
            --dart-define=GOOGLE_CLIENT_ID=android-contract.apps.googleusercontent.com \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=server-contract.apps.googleusercontent.com; then
            echo "unsigned Android release unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Create an external fictional contract-test signer
        shell: bash
        env:
          CONTRACT_KEYSTORE: ${{ runner.temp }}/mobile-release-contract.jks
          CONTRACT_ALIAS: mobile-release-contract
        run: |
          set -euo pipefail
          CONTRACT_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$CONTRACT_PASSWORD"
          keytool -genkeypair -noprompt \
            -keystore "$CONTRACT_KEYSTORE" \
            -storepass "$CONTRACT_PASSWORD" \
            -keypass "$CONTRACT_PASSWORD" \
            -alias "$CONTRACT_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Fictional Contract Test,OU=CI Only,O=Invalid,C=ZZ"
          fingerprint="$(keytool -list -v \
            -keystore "$CONTRACT_KEYSTORE" \
            -storepass "$CONTRACT_PASSWORD" \
            -alias "$CONTRACT_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "fictional signer fingerprint extraction failed" >&2
            exit 1
          fi
          echo "CONTRACT_KEYSTORE=$CONTRACT_KEYSTORE" >> "$GITHUB_ENV"
          echo "CONTRACT_PASSWORD=$CONTRACT_PASSWORD" >> "$GITHUB_ENV"
          echo "CONTRACT_SIGNER_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Build signed contract-test Android App Bundle
        working-directory: ${{ github.workspace }}
        env:
          MOBILE_RELEASE_CONTRACT_TEST: "true"
          MOBILE_RELEASE_CHANNEL: android-closed
          MOBILE_RELEASE_APPLICATION_ID: tw.org.ntubtob.portal.contracttest
          MOBILE_RELEASE_VERSION_NAME: 0.1.0
          MOBILE_RELEASE_VERSION_CODE: "1"
          MOBILE_RELEASE_PREVIOUS_VERSION_CODE: "0"
          MOBILE_RELEASE_STAGING_API_ORIGIN_SHA256: 9e60f93f593ab35cc5e3ed1fa443c25a670f32e0342e5c1876f6ab29876c195c
          MOBILE_RELEASE_STAGING_PROVIDER_CONFIG_SHA256: 47c660e43fc0a90f4c02fdf48584f10cb97137413c42e92ec926c652690c6ced
        run: |
          set -euo pipefail
          python3 -m tools.android_candidate_operator contract-test-build

      - name: Run mobile release tooling tests with offline bundletool
        working-directory: ${{ github.workspace }}
        run: >-
          python3 -m unittest
          tools.tests.test_android_candidate_operator
          tools.tests.test_mobile_release
          tools.tests.test_android_closed_testing
          -v

      - name: Inspect signed contract-test Android App Bundle
        working-directory: ${{ github.workspace }}
        run: >-
          python3 -m tools.mobile_release inspect-aab
          --artifact clients/flutter_app/build/app/outputs/bundle/release/app-release.aab
          --mode contract-test
          --expected-package tw.org.ntubtob.portal.contracttest
          --expected-version-name 0.1.0
          --expected-version-code 1
          --expected-previous-version-code 0
          --expected-staging-api-origin-sha256 9e60f93f593ab35cc5e3ed1fa443c25a670f32e0342e5c1876f6ab29876c195c
          --expected-staging-provider-config-sha256 47c660e43fc0a90f4c02fdf48584f10cb97137413c42e92ec926c652690c6ced
          --expected-signer-sha256 "$CONTRACT_SIGNER_SHA256"

  ios_compile_contract:
    name: Flutter 3.47.0 / iOS Release compile gate
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/flutter_app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Record hosted Apple toolchain
        run: |
          xcodebuild -version
          flutter --version

      - name: Prepare fictional compile-only configuration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'GOOGLE_REVERSED_CLIENT_ID=com.googleusercontent.apps.123-ios' \
            > ios/Flutter/AuthConfig.xcconfig
          printf '%s\n' \
            'IOS_DISTRIBUTION_CHANNEL=testflight' \
            'IOS_TESTFLIGHT_CONTRACT_TEST=YES' \
            'IOS_EXTERNAL_SIGNING_READY=NO' \
            'APPLE_PROVIDER_CONFIGURED_EXTERNALLY=NO' \
            > ios/Flutter/StoreReleaseConfig.xcconfig

      - name: Compile staging TestFlight source without signing
        run: >-
          flutter build ios --release --no-codesign --no-pub
          --build-name=0.1.0
          --build-number=1
          --dart-define=APP_FLAVOR=staging
          --dart-define=CLIENT_MODE=real
          --dart-define=API_BASE_URL=https://mobile-release.invalid
          --dart-define=LINE_CHANNEL_ID=1234567890
          --dart-define=GOOGLE_CLIENT_ID=123-ios.apps.googleusercontent.com
          --dart-define=GOOGLE_SERVER_CLIENT_ID=456-web.apps.googleusercontent.com

      - name: Verify compile-only output and remove private-shaped config
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = "tw.org.ntubtob.portal"
          if codesign --verify build/ios/iphoneos/Runner.app >/dev/null 2>&1; then
            echo "compile-only iOS output unexpectedly contains a valid signature" >&2
            exit 1
          fi
          rm -f ios/Flutter/AuthConfig.xcconfig ios/Flutter/StoreReleaseConfig.xcconfig
          test ! -e ios/Flutter/AuthConfig.xcconfig
          test ! -e ios/Flutter/StoreReleaseConfig.xcconfig
          if ! git diff --quiet; then
            echo "compile-only iOS build changed tracked paths" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "compile-only iOS build changed staged paths" >&2
            exit 1
          fi
          unexpected_untracked="$(
            git ls-files --others --exclude-standard |
              grep -Fvx 'ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved' || true
          )"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "compile-only iOS build left unexpected untracked paths" >&2
            printf '%s\n' "$unexpected_untracked" >&2
            exit 1
          fi

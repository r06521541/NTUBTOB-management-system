name: Flutter tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Flutter 3.47.0 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/flutter_app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build fake Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=APP_FLAVOR=development
          --dart-define=CLIENT_MODE=fake

name: Private iOS profile verification

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed main commit (public)
        required: true
        type: string
      nonce:
        description: One-run binding nonce (public)
        required: true
        type: string

permissions:
  contents: read

jobs:
  native_verification:
    name: Native profile verification
    if: >-
      github.repository == 'r06521541/NTUBTOB-management-system' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && github.sha == inputs.approved_sha
    runs-on: macos-15
    timeout-minutes: 20
    environment: ios-profile-verification
    env:
      INPUT_APPROVED_SHA: ${{ inputs.approved_sha }}
      INPUT_NONCE: ${{ inputs.nonce }}
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install hash-locked dependencies without private input
        run: python -m pip install --no-cache-dir -r tools/requirements-ios-profile-intake.txt
      - name: Prepare production native code without private input
        run: python -m tools.ios_profile_verification_runner --prepare
      - name: Verify private profile in memory
        env:
          IOS_PROFILE_VERIFICATION_INPUT: ${{ secrets.IOS_PROFILE_VERIFICATION_INPUT }}
        run: python -m tools.ios_profile_verification_runner --verify
      - name: Remove public helper and receipt
        if: always()
        run: python -m tools.ios_profile_verification_runner --cleanup

name: ntubtob-portal-data-local

services:
  portal-postgres:
    image: ${PORTAL_DATA_POSTGRES_IMAGE:-postgres:16.4-alpine}
    environment:
      POSTGRES_DB: ntubtob_portal_local
      POSTGRES_USER: portal_local
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:${PORTAL_DATA_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_local -d ntubtob_portal_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - portal-data-postgres:/var/lib/postgresql/data

volumes:
  portal-data-postgres:

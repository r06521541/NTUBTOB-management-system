DSN_DATABASE: dsn_database
DSN_HOSTNAME: dsn_hostname
DSN_PORT: "8787"
DSN_UID: dsn_uid

LINE_LOGIN_CHANNEL_ID: channel_id
LINE_LOGIN_CHANNEL_SECRET: channel_secret

# Identity-link OAuth is disabled unless all six values are injected at runtime.
WEB_IDENTITY_LINK_GOOGLE_CLIENT_ID: ""
WEB_IDENTITY_LINK_GOOGLE_CLIENT_SECRET: ""
WEB_IDENTITY_LINK_GOOGLE_REDIRECT_URI: ""
WEB_IDENTITY_LINK_LINE_CLIENT_ID: ""
WEB_IDENTITY_LINK_LINE_CLIENT_SECRET: ""
WEB_IDENTITY_LINK_LINE_REDIRECT_URI: ""

SECRET_KEY: secret_key

# Comma-separated positive Member IDs. Empty or invalid values deny all access.
WEB_PORTAL_ADMIN_MEMBER_IDS: ""
WEB_PORTAL_IDENTITY_MAINTENANCE_ENABLED: "false"
PORTAL_DATA_PHASE_C_ENABLED: "false"
PORTAL_DATA_ROLLOUT_FREEZE_ENABLED: "false"

steps:

  - name: 'bash:5.2'
    id: 'Validate deployment inputs'
    entrypoint: 'bash'
    args:
    - '-ceu'
    - |
      validate_secret_ref() {
        if [[ ! "$$1" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*:[A-Za-z0-9][A-Za-z0-9._-]*$$ ]]; then
          echo "invalid or missing Secret reference for $$2" >&2
          exit 2
        fi
      }
      validate_pinned_secret_ref() {
        if [[ ! "$$1" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*:[1-9][0-9]*$$ ]]; then
          echo "invalid or unpinned Secret reference for $$2" >&2
          exit 2
        fi
      }
      case '${_IMAGE_TAG}' in
        [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
        *) echo "_IMAGE_TAG must be a 40-character Git commit SHA" >&2; exit 2 ;;
      esac
      validate_secret_ref '${_WEB_PORTAL_LINE_LOGIN_SECRET_REF}' LINE_LOGIN_CHANNEL_SECRET
      validate_secret_ref '${_WEB_PORTAL_SESSION_SECRET_REF}' SECRET_KEY
      validate_secret_ref '${_WEB_PORTAL_WEATHER_SECRET_REF}' WEATHER_API_KEY
      validate_pinned_secret_ref '${_WEB_IDENTITY_LINK_GOOGLE_SECRET_REF}' WEB_IDENTITY_LINK_GOOGLE_CLIENT_SECRET
      validate_pinned_secret_ref '${_WEB_IDENTITY_LINK_LINE_SECRET_REF}' WEB_IDENTITY_LINK_LINE_CLIENT_SECRET
      validate_boolean() {
        case "$$1" in
          true|false) ;;
          *) echo "invalid or missing boolean deployment input for $$2" >&2; exit 2 ;;
        esac
      }
      validate_boolean '${_PORTAL_DATA_PHASE_C_ENABLED}' PORTAL_DATA_PHASE_C_ENABLED
      validate_boolean '${_PORTAL_DATA_ROLLOUT_FREEZE_ENABLED}' PORTAL_DATA_ROLLOUT_FREEZE_ENABLED
      validate_boolean '${_WEB_PORTAL_IDENTITY_MAINTENANCE_ENABLED}' WEB_PORTAL_IDENTITY_MAINTENANCE_ENABLED
      grep -Fqx "PORTAL_DATA_PHASE_C_ENABLED: \"${_PORTAL_DATA_PHASE_C_ENABLED}\"" .env.yaml
      grep -Fqx "PORTAL_DATA_ROLLOUT_FREEZE_ENABLED: \"${_PORTAL_DATA_ROLLOUT_FREEZE_ENABLED}\"" .env.yaml
      grep -Fqx "WEB_PORTAL_IDENTITY_MAINTENANCE_ENABLED: \"${_WEB_PORTAL_IDENTITY_MAINTENANCE_ENABLED}\"" .env.yaml
      grep -Eq '^WEB_IDENTITY_LINK_GOOGLE_CLIENT_ID: "[0-9A-Za-z][0-9A-Za-z._-]{5,255}"$' .env.yaml
      grep -Eq '^WEB_IDENTITY_LINK_LINE_CLIENT_ID: "[0-9A-Za-z][0-9A-Za-z._-]{5,255}"$' .env.yaml
      grep -Eq '^WEB_IDENTITY_LINK_GOOGLE_REDIRECT_URI: "https://[A-Za-z0-9.-]+(:[1-9][0-9]{0,4})?/api/v1/auth/identity-link/web/callback/google"$' .env.yaml
      grep -Eq '^WEB_IDENTITY_LINK_LINE_REDIRECT_URI: "https://[A-Za-z0-9.-]+(:[1-9][0-9]{0,4})?/api/v1/auth/identity-link/web/callback/line"$' .env.yaml

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/management-system-docker-repo/${_SERVICE_NAME}-image:${_IMAGE_TAG}',
      '.'
    ]
    automapSubstitutions: true

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      '${_REGION}-docker.pkg.dev/$PROJECT_ID/management-system-docker-repo/${_SERVICE_NAME}-image:${_IMAGE_TAG}'
    ]
    automapSubstitutions: true
    
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
    - '-c'
    - |
      gcloud run deploy ${_SERVICE_NAME} \
        --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/management-system-docker-repo/${_SERVICE_NAME}-image:${_IMAGE_TAG} \
        --update-secrets=DSN_PASSWORD=supabase-database-password:latest,LINE_LOGIN_CHANNEL_SECRET=${_WEB_PORTAL_LINE_LOGIN_SECRET_REF},SECRET_KEY=${_WEB_PORTAL_SESSION_SECRET_REF},WEATHER_API_KEY=${_WEB_PORTAL_WEATHER_SECRET_REF},WEB_IDENTITY_LINK_GOOGLE_CLIENT_SECRET=${_WEB_IDENTITY_LINK_GOOGLE_SECRET_REF},WEB_IDENTITY_LINK_LINE_CLIENT_SECRET=${_WEB_IDENTITY_LINK_LINE_SECRET_REF} \
        --region ${_REGION} \
        --platform managed \
        --allow-unauthenticated \
        --env-vars-file .env.yaml
    env:
    - 'CLOUDSDK_CORE_PROJECT=$PROJECT_ID'

options:
  substitutionOption: 'ALLOW_LOOSE'

steps:

  - name: 'bash:5.2'
    id: 'Validate deployment inputs'
    entrypoint: 'bash'
    args:
    - '-ceu'
    - |
      validate_secret_ref() {
        case "$$1" in
          ''|'${_'*'}'|*' '*|*=*)
            echo "invalid or missing Secret reference for $$2" >&2
            exit 2
            ;;
        esac
        case "$$1" in
          *:*) ;;
          *)
            echo "invalid or missing Secret reference for $$2" >&2
            exit 2
            ;;
        esac
      }
      case '${_IMAGE_TAG}' in
        [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
        *) echo "_IMAGE_TAG must be a 40-character Git commit SHA" >&2; exit 2 ;;
      esac
      validate_secret_ref '${_WEB_PORTAL_LINE_LOGIN_SECRET_REF}' LINE_LOGIN_CHANNEL_SECRET
      validate_secret_ref '${_WEB_PORTAL_SESSION_SECRET_REF}' SECRET_KEY

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/management-system-docker-repo/${_SERVICE_NAME}-image:${_IMAGE_TAG}',
      '.'
    ]
    automapSubstitutions: true

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      '${_REGION}-docker.pkg.dev/$PROJECT_ID/management-system-docker-repo/${_SERVICE_NAME}-image:${_IMAGE_TAG}'
    ]
    automapSubstitutions: true
    
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
    - '-c'
    - |
      gcloud run deploy ${_SERVICE_NAME} \
        --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/management-system-docker-repo/${_SERVICE_NAME}-image:${_IMAGE_TAG} \
        --update-secrets=DSN_PASSWORD=supabase-database-password:latest,LINE_LOGIN_CHANNEL_SECRET=${_WEB_PORTAL_LINE_LOGIN_SECRET_REF},SECRET_KEY=${_WEB_PORTAL_SESSION_SECRET_REF} \
        --region ${_REGION} \
        --platform managed \
        --allow-unauthenticated \
        --env-vars-file .env.yaml
    env:
    - 'CLOUDSDK_CORE_PROJECT=$PROJECT_ID'

options:
  substitutionOption: 'ALLOW_LOOSE'

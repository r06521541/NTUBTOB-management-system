<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>臺大棒球校友平台</title>
        <meta property="og:title" content="臺大棒球校友平台" />
        <meta property="og:description" content="進來確認校友隊各類資訊！" />
        <meta property="og:image"
              content="https://storage.googleapis.com/web_portal_images/logo_square.png" />
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}" />

        <main class="auth-shell">

                <div class="auth-actions">
                    <a class="auth-button auth-button-secondary"
                       href="{{ url_for('member_dashboard') }}">進入球隊戰情室</a>
                </div>
            </section>
        </main>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <title>登入狀態已過期</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">

      <section class="auth-panel" aria-labelledby="error-title">
        <img class="auth-logo" src="{{ url_for('static', filename='images/logo_square.png') }}" alt="NTUBTOB 球隊隊徽">
        <p class="auth-eyebrow">LOGIN RECOVERY</p>

        <div class="auth-actions"><a class="auth-button auth-button-secondary" data-login-mode="browser" href="{{ fallback_url }}">改用瀏覽器登入</a></div>
      </section>
    </main>
</body>
</html>

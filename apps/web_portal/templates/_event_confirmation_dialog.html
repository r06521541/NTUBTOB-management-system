<dialog class="portal-confirm-dialog" data-event-confirm-dialog aria-labelledby="event-confirm-title">
    <div class="portal-confirm-dialog-card">
        <p class="portal-eyebrow">CONFIRM</p>
        <h2 id="event-confirm-title">確認活動異動</h2>
        <p data-event-confirm-message>請確認這次操作。</p>
        <div class="portal-confirm-actions">
            <button type="button" class="portal-action portal-action-secondary" data-event-confirm-cancel>返回檢查</button>
            <button type="button" class="portal-action" data-event-confirm-submit>確認送出</button>
        </div>
    </div>
</dialog>

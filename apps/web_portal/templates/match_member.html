<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>配對新的LINE帳號成員</title>
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <meta property="og:title" content="配對新成員" />
        <meta property="og:description" content="配對新的LINE帳號成員" />
        <meta property="og:image" content="https://storage.googleapis.com/web_portal_images/logo_square.png" />
    </head>
    <body>
        <div class="container">
            <h1 class="mb-4">配對新的LINE帳號成員</h1>
            {% if not identity_maintenance_enabled %}
                <div class="alert alert-warning" role="status">配對維護暫停中；目前僅可唯讀查看待配對帳號。</div>
            {% endif %}
            {% for line_user in line_users %}
                <form method="post" action="{{ url_for('match_line_user') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="row justify-content-md-center">
                        <div class="col-md-2">
                            <h5>{{ line_user.nickname }}</p>
                        </div>
                        <div class="col-md-2">
                            <input type="hidden" name="request_id" value="identity-match-{{ csrf_token }}-{{ loop.index }}">
                            <label>原因 <input name="reason" minlength="3" maxlength="300" required {% if not identity_maintenance_enabled %}disabled{% endif %}></label>
                            <button type="submit" class="btn btn-secondary" formaction="{{ url_for('ignore_line_user') }}" onclick="this.form.request_id.value='identity-ignore-{{ csrf_token }}-{{ loop.index }}'" {% if not identity_maintenance_enabled %}disabled{% endif %}>暫時忽略</button>
                        </div>
                        <div class="col-md-2">
                            <p>或是將他綁定為</p>
                        </div>
                        <div class="col-md-2">
                            <select name="member_id" {% if not identity_maintenance_enabled %}disabled{% endif %}>
                                {% for member in members %}
                                    <option value="{{ member.id }}">{{ member.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary" {% if not identity_maintenance_enabled %}disabled{% endif %}>確認</button>
                        </div>
                        <div class="col">
                            <input type="hidden" name="line_user_id" value="{{ line_user.line_user_id }}">
                        </div>
                    </div>
                </form>
            {% endfor %}
        </div>
    </body>
</html>

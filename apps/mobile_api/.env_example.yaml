MOBILE_API_AUDIENCE: fake-native-line-client-id
# Comma-separated approved Google OAuth client IDs; empty intentionally fails closed.
MOBILE_API_GOOGLE_AUDIENCES: ""
# Optional Sign in with Apple lifecycle group; any empty value disables Apple only.
MOBILE_API_APPLE_AUDIENCE: ""
MOBILE_API_APPLE_CLIENT_SECRET: ""
MOBILE_API_APPLE_PROVIDER_CREDENTIAL_KEY: ""
MOBILE_API_APPLE_NOTIFICATION_AUDIENCE: ""
MOBILE_ACCESS_SIGNING_KEY: injected-at-runtime
MOBILE_REFRESH_REPLAY_KEY: injected-at-runtime
PORTAL_DATA_DATABASE_URL: postgresql+psycopg2://local-only-example
# Access guards only; intake opt-in below requires this exact true as well.
PORTAL_DATA_ERASURE_CHECKS_ENABLED: "false"
# Intake/receipt/fresh-proof routes only, not executor/materializer/UI enablement.
# Keep false until full operator, custody, guard and preflight approval.
MOBILE_API_ERASURE_INTAKE_ENABLED: "false"
# Canonical padded URL-safe base64, >=32 decoded bytes, runtime injected.
# Both must differ from each other and all signing/replay/provider encryption keys.
MOBILE_API_ERASURE_RECEIPT_KEY: ""
MOBILE_API_ERASURE_PROOF_KEY: ""
# One exact member of MOBILE_API_GOOGLE_AUDIENCES; nonce is mandatory for erasure.
# LINE/Apple use MOBILE_API_AUDIENCE / MOBILE_API_APPLE_AUDIENCE respectively.
MOBILE_API_ERASURE_GOOGLE_AUDIENCE: ""
